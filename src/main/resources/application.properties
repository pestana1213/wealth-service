spring.application.name=wealth-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql:///wealth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wealth}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:wealth_local}
spring.datasource.hikari.maximum-pool-size=${POOL_SIZE:10}

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# Off unless asked for: the API description and Swagger UI are for development,
# not for anyone who can reach the service. Set API_DOCS_ENABLED=true locally.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Access tokens are JWTs issued by Zitadel for the wealth-frontend application.
# The keys are fetched from the issuer's discovery document on first use, so the
# service starts even when Zitadel is briefly unreachable. The audience is the
# Zitadel project id, which every application in the project receives.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ZITADEL_ISSUER:https://zitadel.tail654c62.ts.net}
spring.security.oauth2.resourceserver.jwt.audiences=${ZITADEL_AUDIENCE:398132894750474336}

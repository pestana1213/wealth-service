name: Build Spring Boot and Push to GHCR

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The image build skips tests and a push to main deploys, so this is the
      # only gate. Testcontainers starts PostgreSQL in the runner's Docker.
      - name: Run tests
        run: ./mvnw -B verify

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Set Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update GitOps repo image tag
        run: |
          set -euo pipefail

          git clone https://x-access-token:${{ secrets.GH_ACTIONS_TOKEN }}@github.com/pestana1213/golias-homelab.git
          cd golias-homelab

          # wealth-service is required. Any other app listed here is optional:
          # it may not have landed on this branch yet, and a missing optional
          # app must not block the production tag bump.
          REQUIRED_APP=wealth-service
          OPTIONAL_APPS="wealth-loadtest"

          bump() {
            local APP="$1" FILE="apps/$1/kustomization.yaml"

            if [ ! -f "$FILE" ]; then
              echo "::warning::$APP has no kustomization.yaml, skipping"
              return 1
            fi

            echo "Before ($APP):"
            cat "$FILE"

            # Narrow range: only the wealth-service entry, so the
            # wealth-frontend tag next to it is left alone.
            sed -i "/name: ghcr.io\/pestana1213\/wealth-service$/,/newTag:/ s/newTag:.*/newTag: ${{ github.sha }}/" "$FILE"

            # Verify rather than trust the sed exit status: a malformed range
            # fails silently and would commit the wrong tag.
            if ! grep -q "newTag: ${{ github.sha }}" "$FILE"; then
              echo "::error::$APP was not updated to ${{ github.sha }}"
              return 1
            fi

            echo "After ($APP):"
            cat "$FILE"
            return 0
          }

          bump "$REQUIRED_APP"

          CHANGED="apps/$REQUIRED_APP/kustomization.yaml"

          for APP in $OPTIONAL_APPS; do
            if bump "$APP"; then
              CHANGED="$CHANGED apps/$APP/kustomization.yaml"
            fi
          done

          git diff

          # The load-test scripts are owned by this repository and mounted into
          # the k6 CronJob from a generated ConfigMap, so regenerate it here
          # rather than letting it drift from the scripts that were just tested.
          SCRIPTS_CONFIGMAP="apps/wealth-loadtest/scripts-configmap.yaml"

          if [ -d apps/wealth-loadtest ]; then
            # Invoked via python3 and by absolute path: the shell is sitting in
            # the homelab clone, and the executable bit does not survive a
            # checkout on every platform.
            python3 "$GITHUB_WORKSPACE/load-tests/render-configmap.py" > "$SCRIPTS_CONFIGMAP"
            CHANGED="$CHANGED $SCRIPTS_CONFIGMAP"
            echo "Regenerated $SCRIPTS_CONFIGMAP"
          else
            echo "::warning::apps/wealth-loadtest absent, ConfigMap not regenerated"
          fi

          # shellcheck disable=SC2086
          git add $CHANGED

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update wealth-service image to ${{ github.sha }}"
          git push

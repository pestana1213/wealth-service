name: Build Spring Boot and Push to GHCR

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Set Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update GitOps repo image tag
        run: |
          git clone https://x-access-token:${{ secrets.GH_ACTIONS_TOKEN }}@github.com/pestana1213/golias-homelab.git

          cd golias-homelab/apps/wealth-service

          echo "Before:"
          cat kustomization.yaml

          sed -i "/name: ghcr.io\/pestana1213\/wealth-service$/,/newTag:/ s/newTag:.*/newTag: ${{ github.sha }}/" kustomization.yaml

          echo "After:"
          cat kustomization.yaml

          git diff

          git add kustomization.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update wealth-service image to ${{ github.sha }}"
          git push
